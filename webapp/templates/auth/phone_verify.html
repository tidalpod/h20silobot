{% extends "base.html" %}

{% block title %}Verify Code{% endblock %}

{% block content %}
<div class="flex min-h-full flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="flex items-center justify-center gap-3">
            <img src="/static/images/logo.png" alt="Blue Deer" class="h-12 w-12 object-contain">
            <h1 class="text-3xl font-bold text-blue-600">Blue Deer</h1>
        </div>
        <h2 class="mt-6 text-center text-2xl font-bold leading-9 tracking-tight text-gray-900">
            Enter verification code
        </h2>
        <p class="mt-2 text-center text-sm text-gray-500">Sent to {{ phone }}</p>
    </div>

    <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-[480px]">
        <div class="bg-white px-6 py-12 shadow sm:rounded-lg sm:px-12">
            {% if error %}
            <div class="mb-4 rounded-md bg-red-50 p-4">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="text-sm font-medium text-red-800">{{ error }}</p>
                    </div>
                </div>
            </div>
            {% endif %}

            <form class="space-y-6" action="/login/verify" method="POST" id="verify-form">
                <div>
                    <label class="block text-sm font-medium leading-6 text-gray-900 text-center mb-3">Verification Code</label>
                    <div class="flex justify-center gap-2" id="code-inputs">
                        <input type="text" maxlength="1" class="code-input" data-idx="0" inputmode="numeric" autofocus>
                        <input type="text" maxlength="1" class="code-input" data-idx="1" inputmode="numeric">
                        <input type="text" maxlength="1" class="code-input" data-idx="2" inputmode="numeric">
                        <input type="text" maxlength="1" class="code-input" data-idx="3" inputmode="numeric">
                        <input type="text" maxlength="1" class="code-input" data-idx="4" inputmode="numeric">
                        <input type="text" maxlength="1" class="code-input" data-idx="5" inputmode="numeric">
                    </div>
                    <input type="hidden" name="code" id="code-hidden">
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center rounded-md bg-blue-600 px-3 py-2.5 text-sm font-semibold leading-6 text-white shadow-sm hover:bg-blue-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600">
                        Verify
                    </button>
                </div>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-gray-500">
            <a href="/login/phone" class="text-blue-600 hover:text-blue-500 font-medium">Use a different number</a>
        </p>
    </div>
</div>

<style>
    .code-input {
        width: 3rem; height: 3.5rem;
        text-align: center; font-size: 1.5rem; font-weight: 700;
        border: 2px solid #d1d5db; border-radius: 0.75rem;
    }
    .code-input:focus {
        border-color: #2563eb; outline: none; box-shadow: 0 0 0 3px rgba(37,99,235,0.3);
    }
</style>

<script>
const inputs = document.querySelectorAll('.code-input');
const hidden = document.getElementById('code-hidden');

inputs.forEach((input, idx) => {
    input.addEventListener('input', (e) => {
        if (e.target.value && idx < inputs.length - 1) inputs[idx + 1].focus();
        updateHidden();
    });
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !input.value && idx > 0) inputs[idx - 1].focus();
    });
    input.addEventListener('paste', (e) => {
        e.preventDefault();
        const paste = (e.clipboardData || window.clipboardData).getData('text').trim();
        for (let i = 0; i < Math.min(paste.length, 6); i++) inputs[i].value = paste[i];
        if (paste.length >= 6) inputs[5].focus();
        updateHidden();
    });
});

function updateHidden() {
    hidden.value = Array.from(inputs).map(i => i.value).join('');
}

document.getElementById('verify-form').addEventListener('submit', () => updateHidden());
</script>
{% endblock %}
