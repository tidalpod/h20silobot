<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Link Expired — Blue Deer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

<header class="bg-blue-800 text-white">
    <div class="max-w-2xl mx-auto px-4 py-4 flex items-center gap-3">
        <svg class="w-8 h-8" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <h1 class="text-lg font-bold">Blue Deer Property Management</h1>
    </div>
</header>

<main class="max-w-2xl mx-auto px-4 py-12">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8 text-center">
        <div class="w-16 h-16 rounded-full bg-amber-100 flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8 text-amber-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-2">Link Expired or Invalid</h2>
        <p class="text-gray-600 mb-4">
            This signing link is no longer valid. It may have expired, been voided, or already been used.
        </p>
        <p class="text-sm text-gray-500">
            If you believe this is an error, please contact your property manager to request a new signing link.
        </p>
    </div>
</main>

</body>
</html>
