{% extends "base.html" %}

{% block title %}New Lease{% endblock %}

{% block header %}
<header class="bg-white shadow-sm">
    <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
        <div class="flex items-center gap-2 mb-2">
            <a href="/leases/builder" class="text-sm text-blue-600 hover:text-blue-500">&larr; Lease Builder</a>
        </div>
        <h1 class="text-3xl font-bold tracking-tight text-gray-900">Start New Lease</h1>
        <p class="mt-1 text-sm text-gray-500">Select a property and tenant to begin</p>
    </div>
</header>
{% endblock %}

{% block content %}
<div class="max-w-2xl">
    <form method="POST" action="/leases/builder/new">
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 space-y-6">
            <!-- Property -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Property *</label>
                <select name="property_id" required class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 searchable-select" data-placeholder="Type to search properties...">
                    <option value="">Select a property...</option>
                    {% for prop in properties %}
                    <option value="{{ prop.id }}">{{ prop.address }}{% if prop.city %}, {{ prop.city }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <!-- Template Type -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Lease Template *</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-start gap-3 p-4 rounded-lg border cursor-pointer hover:bg-gray-50 border-blue-300 bg-blue-50" id="label-standard">
                        <input type="radio" name="template_type" value="standard" checked onchange="updateTemplateLabels()" class="mt-0.5">
                        <div>
                            <p class="text-sm font-medium text-gray-900">Standard</p>
                            <p class="text-xs text-gray-500">Basic Michigan lease (~12 pages)</p>
                        </div>
                    </label>
                    <label class="flex items-start gap-3 p-4 rounded-lg border cursor-pointer hover:bg-gray-50 border-gray-200" id="label-comprehensive">
                        <input type="radio" name="template_type" value="comprehensive" onchange="updateTemplateLabels()" class="mt-0.5">
                        <div>
                            <p class="text-sm font-medium text-gray-900">Comprehensive Michigan</p>
                            <p class="text-xs text-gray-500">Full master lease with tenant responsibilities (~29 pages)</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Tenant -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Primary Tenant</label>
                <select name="tenant_id" class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 searchable-select" data-placeholder="Type to search tenants...">
                    <option value="">Select a tenant (optional)...</option>
                    {% for tenant in tenants %}
                    <option value="{{ tenant.id }}">{{ tenant.name }}{% if tenant.property_ref %} — {{ tenant.property_ref.address }}{% endif %}</option>
                    {% endfor %}
                </select>
                <p class="text-xs text-gray-400 mt-1">You can add tenants manually in step 3</p>
            </div>
        </div>

        <div class="mt-6 flex justify-end gap-3">
            <a href="/leases/builder" class="px-6 py-3 rounded-lg text-sm font-medium text-gray-700 bg-white ring-1 ring-gray-300 hover:bg-gray-50 transition-colors">Cancel</a>
            <button type="submit" class="px-6 py-3 rounded-lg text-sm font-medium text-white bg-blue-600 hover:bg-blue-500 shadow-sm transition-colors">
                Start Building &rarr;
            </button>
        </div>
    </form>
</div>

<script>
function updateTemplateLabels() {
    const std = document.getElementById('label-standard');
    const comp = document.getElementById('label-comprehensive');
    const isStd = document.querySelector('input[name="template_type"][value="standard"]').checked;
    std.className = std.className.replace(/border-\S+\s*bg-\S+/g, '').trim() + (isStd ? ' border-blue-300 bg-blue-50' : ' border-gray-200');
    comp.className = comp.className.replace(/border-\S+\s*bg-\S+/g, '').trim() + (!isStd ? ' border-blue-300 bg-blue-50' : ' border-gray-200');
}
</script>
{% endblock %}
